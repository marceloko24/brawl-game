name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar sitio
        run: |
          mkdir -p _site/icons
          cp index.html style.css data.js art.js audio.js game.js ui.js main.js sw.js manifest.webmanifest _site/
          for f in icon-192 icon-512 apple-touch-icon; do base64 -d icons/$f.png.b64 > _site/icons/$f.png; done
          touch _site/.nojekyll
          ls -la _site _site/icons
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
